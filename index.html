<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>Báo cáo số dư ngân hàng</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--bd:#e5e7eb;--a:#2563eb;--b:#f59e0b;--up:#059669;--dn:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1217;--card:#181c23;--tx:#e8eaed;--mu:#9aa3b2;--bd:#2a303a;--a:#60a5fa;--b:#fbbf24;--up:#34d399;--dn:#f87171;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 12px}.sm{font-size:12px;color:var(--mu)}
select,input[type=search],.btn{padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;font-size:14px}
.btn{cursor:pointer}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:18px}.kp .c{margin:0}
.k{color:var(--mu);font-size:13px}.v{font-size:24px;font-weight:650}
.up{color:var(--up)}.dn{color:var(--dn)}
.row{display:grid;grid-template-columns:60px 1fr 150px;gap:10px;align-items:center;padding:6px 0}
.row .n{text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.bar{display:flex;height:20px;border-radius:6px;overflow:hidden;background:var(--bd)}.bar i{display:block;height:100%}
.lg{display:flex;gap:16px;font-size:12px;color:var(--mu);margin-bottom:6px}
.lg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--a)}.lg span+span:before{background:var(--b)}
details{border-top:1px solid var(--bd)}summary{cursor:pointer;display:grid;grid-template-columns:60px 1fr auto;gap:10px;padding:10px 0;list-style:none}
summary::-webkit-details-marker{display:none}
.tb{overflow-x:auto;padding-bottom:8px}table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:500}.r{text-align:right;font-variant-numeric:tabular-nums}
.err{background:var(--card);border:1px solid var(--dn);border-radius:12px;padding:14px 16px;margin-bottom:18px;display:none}
svg text{fill:var(--mu);font-size:11px}
</style></head><body><div class="w">
<header><div><h1>Báo cáo số dư ngân hàng</h1><div class="sm" id="meta">Đang tải...</div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><select id="dt"></select>
<input type="file" id="f" accept=".json" multiple hidden><button class="btn" onclick="f.click()">Nạp file JSON thủ công</button></div></header>
<div class="err" id="err"></div>
<div class="kp" id="kp"></div>
<div class="c"><h2>Tổng tiền theo ngày</h2><div id="trend"></div></div>
<div class="c"><h2>Phân bổ theo ngân hàng</h2><div class="lg"><span>Thanh toán</span><span>Tiền gửi / Saving</span></div><div id="bars"></div></div>
<div class="c"><h2>Chi tiết từng ngân hàng</h2><input type="search" id="q" placeholder="Tìm số tài khoản, tên, ngân hàng..." style="width:100%;margin-bottom:8px"><div id="list"></div></div>
<p class="sm" id="note"></p></div>
<script>
const $=id=>document.getElementById(id);
const F=n=>n.toLocaleString("vi-VN"),T=n=>(n/1e9).toLocaleString("vi-VN",{maximumFractionDigits:2})+" tỷ";
const DT=n=>(n>0?"+":"")+T(n);
const isSv=r=>/saving/i.test(r.type),isVnd=r=>!/USD|EUR/i.test(r.name||"");
let DAYS={}; // date -> rows
const ymd=d=>d.replaceAll("-","");
async function getJson(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw 0;return r.json()}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let ENC={};
async function deriveKey(pw){const te=new TextEncoder();
 const km=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:te.encode("so-du-ngan-hang-v1"),iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"])}
async function decryptAll(pw){const key=await deriveKey(pw),out={};let bad=0;
 for(const d of Object.keys(ENC)){try{const o=ENC[d];
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},key,unb64(o.data));
  const j=JSON.parse(new TextDecoder().decode(pt));out[j.date||d]=j.rows}catch(e){bad++}}
 if(!Object.keys(out).length)throw new Error("wrong password");
 if(bad)console.warn(bad+" file không giải mã được bằng mật khẩu này, đã bỏ qua");
 return out}
async function load(){
 let dates=[];
 try{dates=await getJson("data/index.json")}catch(e){}
 {const t=new Date(),set=new Set(dates);for(let i=0;i<90;i++){const d=new Date(t-i*864e5);set.add(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"))}dates=[...set]}
 await Promise.all(dates.map(async d=>{try{ENC[d]=await getJson("data/balance_"+ymd(d)+".enc.json")}catch(e){}}));
 if(!Object.keys(ENC).length){const e=$("err");
  const base=new URL("data/",location.href).href;
  e.innerHTML=location.protocol==="file:"
   ?"Bạn đang mở file trực tiếp từ máy (<b>file://</b>) nên trình duyệt chặn đọc thư mục data. Hãy mở bằng link GitHub Pages (https://...github.io/...)."
   :"Không tìm thấy file dữ liệu nào ở <code>"+base+"</code>.<br>Kiểm tra: (1) trên GitHub có thư mục <b>data</b> (viết thường) chứa file <b>balance_YYYYMMDD.enc.json</b>; (2) mở thử link <code>"+base+"balance_"+ymd(dates[dates.length-1]).slice(0,0)+"YYYYMMDD.enc.json</code> (thay bằng ngày thật) xem có hiện nội dung không; (3) chờ 1-2 phút sau khi đẩy file. Hoặc bấm <b>Nạp file JSON thủ công</b> để xem ngay.";
  e.style.display="block";
  init();return}
 let pw="";try{pw=sessionStorage.getItem("pw")||""}catch(e){}
 for(;;){
  if(!pw)pw=prompt("Nhập mật khẩu để xem báo cáo:")||"";
  if(!pw){$("meta").textContent="Cần mật khẩu để xem dữ liệu. Tải lại trang để nhập lại.";return}
  try{$("meta").textContent="Đang giải mã...";DAYS=await decryptAll(pw);try{sessionStorage.setItem("pw",pw)}catch(e){}break}
  catch(e){try{sessionStorage.removeItem("pw")}catch(x){}pw="";alert("Sai mật khẩu hoặc file bị lỗi, thử lại.")}
 }
 init();
}
function sums(rows){const g={};rows.filter(isVnd).forEach(r=>{const x=g[r.bank]=g[r.bank]||{b:r.bank,ca:0,sv:0};x[isSv(r)?"sv":"ca"]+=r.balance});return g}
function init(){
 const ds=Object.keys(DAYS).sort().reverse();
 $("dt").innerHTML=ds.map(d=>`<option>${d}</option>`).join("");$("dt").style.display=ds.length?"":"none";
 render();
}
function render(){
 const ds=Object.keys(DAYS).sort();if(!ds.length){$("meta").textContent="Chưa có dữ liệu";return}
 const cur=$("dt").value||ds[ds.length-1],i=ds.indexOf(cur),prev=i>0?ds[i-1]:null;
 const rows=DAYS[cur],g=sums(rows),pg=prev?sums(DAYS[prev]):null;
 const banks=Object.values(g).map(x=>({...x,tot:x.ca+x.sv,rows:rows.filter(r=>r.bank===x.b)})).sort((a,b)=>b.tot-a.tot);
 const tot=banks.reduce((s,x)=>s+x.tot,0),ca=banks.reduce((s,x)=>s+x.ca,0),sv=banks.reduce((s,x)=>s+x.sv,0);
 const ptot=pg?Object.values(pg).reduce((s,x)=>s+x.ca+x.sv,0):null;
 const dl=(d)=>d==null?"":`<span class="${d>=0?"up":"dn"}">${DT(d)}</span> so với ${prev}`;
 const fx=rows.filter(r=>!isVnd(r)&&r.balance>0).length;
 $("meta").textContent=`Số dư ngày ${cur} · ${banks.length} ngân hàng · ${rows.length} tài khoản`;
 $("kp").innerHTML=[["Tổng tiền (VND)",T(tot),ptot==null?F(tot)+" đ":dl(tot-ptot)],["Thanh toán",T(ca),(tot?ca/tot*100:0).toFixed(1)+"%"],["Tiền gửi / Saving",T(sv),(tot?sv/tot*100:0).toFixed(1)+"%"],["Số ngày có dữ liệu",ds.length,"từ "+ds[0]]].map(a=>`<div class="c"><div class="k">${a[0]}</div><div class="v">${a[1]}</div><div class="sm">${a[2]}</div></div>`).join("");
 const mx=banks[0]?banks[0].tot:1;
 $("bars").innerHTML=banks.map(x=>{const p=pg&&pg[x.b]?x.tot-pg[x.b].ca-pg[x.b].sv:null;
  return `<div class="row"><b>${x.b}</b><div class="bar" style="width:${Math.max(x.tot/mx*100,1)}%"><i style="width:${x.tot?x.ca/x.tot*100:0}%;background:var(--a)"></i><i style="width:${x.tot?x.sv/x.tot*100:0}%;background:var(--b)"></i></div><span class="n">${T(x.tot)}${p!=null&&p!==0?`<br><span class="sm ${p>=0?"up":"dn"}">${DT(p)}</span>`:""}</span></div>`}).join("");
 trend(ds,cur);
 const q=$("q").value.trim().toLowerCase();let h="";
 banks.forEach(x=>{const rs=x.rows.filter(r=>!q||(r.bank+r.code+r.name).toLowerCase().includes(q));if(!rs.length)return;
  h+=`<details ${q?"open":""}><summary><b>${x.b}</b><span class="sm">Thanh toán ${T(x.ca)} · Tiền gửi ${T(x.sv)}</span><b class="r">${F(x.tot)}</b></summary><div class="tb"><table><thead><tr><th>Mã</th><th>Tên</th><th>Loại</th><th class="r">Số dư</th></tr></thead><tbody>`+rs.map(r=>`<tr><td>${r.code}</td><td>${r.name}</td><td>${isSv(r)?"Tiền gửi":"Thanh toán"}</td><td class="r">${F(r.balance)}</td></tr>`).join("")+`</tbody></table></div></details>`});
 $("list").innerHTML=h||'<p class="sm">Không có kết quả.</p>';
 $("note").textContent=fx?`Có ${fx} tài khoản ngoại tệ có số dư, chưa cộng vào tổng VND.`:"";
}
function trend(ds,cur){
 if(ds.length<2){$("trend").innerHTML='<p class="sm">Cần ít nhất 2 ngày dữ liệu để vẽ biến động. Mỗi ngày thêm một file balance_YYYYMMDD.json vào data/.</p>';return}
 const pts=ds.map(d=>[d,Object.values(sums(DAYS[d])).reduce((s,x)=>s+x.ca+x.sv,0)]);
 const W=900,H=200,P=40,mn=Math.min(...pts.map(p=>p[1])),mxv=Math.max(...pts.map(p=>p[1])),rg=(mxv-mn)||1;
 const X=i=>P+i*(W-2*P)/(pts.length-1),Y=v=>H-30-(v-mn)/rg*(H-60);
 $("trend").innerHTML=`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:560px"><polyline fill="none" stroke="var(--a)" stroke-width="2" points="${pts.map((p,i)=>X(i)+","+Y(p[1])).join(" ")}"/>`+
 pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p[1])}" r="${p[0]===cur?5:3}" fill="var(--a)"><title>${p[0]}: ${T(p[1])}</title></circle>`+(i%Math.ceil(pts.length/8)===0||i===pts.length-1?`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${p[0].slice(5)}</text>`:"")).join("")+
 `<text x="4" y="${Y(mxv)+4}">${T(mxv)}</text><text x="4" y="${Y(mn)+4}">${T(mn)}</text></svg></div>`;
}
$("dt").addEventListener("change",render);$("q").addEventListener("input",render);
$("f").addEventListener("change",async e=>{
 let pw="";
 for(const file of e.target.files){try{let j=JSON.parse(await file.text());
  if(j.iv&&j.data){pw=pw||prompt("Nhập mật khẩu:")||"";const key=await deriveKey(pw);
   j=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(j.iv)},key,unb64(j.data))))}
  if(j.date&&j.rows)DAYS[j.date]=j.rows}catch(x){alert("Không đọc được "+file.name)}}
 $("err").style.display="none";init();e.target.value="";
});
load();
</script></body></html>
